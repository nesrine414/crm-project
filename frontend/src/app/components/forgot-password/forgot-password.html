<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">L</div>
      <span class="brand-name">LCA CRM</span>
    </div>

    <h2>Mot de passe oublié</h2>
    <p class="subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

    @if (!submitted()) {
      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Email <span class="required">*</span></label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="vous@exemple.com" required>
        </div>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Envoi en cours...' : 'Envoyer le lien' }}
        </button>
      </form>
    } @else {
      <p style="color: #10B981; font-weight: 600; text-align: center; margin: 20px 0;">
        ✅ Si ce compte existe, un email vient d'être envoyé. Vérifie ta boîte de réception (et tes spams).
      </p>
    }

    <p class="signup-row"><a routerLink="/login">Retour à la connexion</a></p>
  </div>
</div>
