<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">L</div>
      <span class="brand-name">LCA CRM</span>
    </div>

    <h2>Nouveau mot de passe</h2>
    <p class="subtitle">Choisis un nouveau mot de passe</p>

    @if (!success()) {
      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Nouveau mot de passe <span class="required">*</span></label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" required>
        </div>

        <div class="field">
          <label>Confirmer <span class="required">*</span></label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
        </div>

        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Mise à jour...' : 'Réinitialiser' }}
        </button>
      </form>
    } @else {
      <p style="color: #10B981; font-weight: 600; text-align: center; margin: 20px 0;">
        ✅ Mot de passe mis à jour. Redirection vers la connexion...
      </p>
    }
  </div>
</div>
