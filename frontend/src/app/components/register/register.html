<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">L</div>
      <span class="brand-name">LCA CRM</span>
    </div>

    <h2>Créer un compte</h2>
    <p class="subtitle">Rejoignez votre espace de gestion client</p>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Nom complet <span class="required">*</span></label>
        <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Amira Ben Salah" required>
      </div>

      <div class="field">
        <label>Email <span class="required">*</span></label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="vous@exemple.com" required>
      </div>

      <div class="field">
        <label>Mot de passe <span class="required">*</span></label>
        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" (click)="togglePassword()">{{ showPassword() ? 'Cacher' : 'Voir' }}</button>
        </div>
      </div>

      <div class="field">
        <label>Confirmer le mot de passe <span class="required">*</span></label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
      </div>

      <label class="privacy-check">
        <input type="checkbox" [(ngModel)]="acceptedPrivacy" name="acceptedPrivacy" required>
        <span>En créant un compte, vous acceptez la <a href="#" (click)="$event.preventDefault()">politique de confidentialité</a> de LCA CRM.</span>
      </label>

@if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="!acceptedPrivacy || isLoading()">
        {{ isLoading() ? 'Création en cours...' : 'Créer mon compte' }}
      </button>    </form>
    

    <p class="signup-row">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
